<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChessLens · 수순 설명</title><link rel="preload" href="/assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/assets/explain.css"></head>
<body><main class="lens"><header><h1 class="brand-title">ChessLens</h1><button id="close" title="분석 닫기">×</button></header>
<section id="start"><label class="upload">체스 화면 첨부<input id="image" type="file" accept="image/png,image/jpeg"></label><label>질문<input id="question" placeholder="이 수가 왜 좋은 수인가요?"></label><details><summary>판 정보 직접 입력 (FEN)</summary><label>현재 판 정보 (FEN)<input id="initial-fen" placeholder="FEN 문자열을 붙여넣으세요"></label><label class="check"><input id="initial-confirm" type="checkbox">차례와 캐슬링·앙파상 가능 여부를 확인했습니다</label></details><button id="submit" class="primary">분석 시작</button><a href="/">판 인식 도구 ↗</a></section>
<div class="status"><span id="dot"></span><span id="status">체스 화면을 첨부해 시작하세요.</span></div>
<section id="review" hidden>
<div class="source"><img id="crop" alt="인식한 체스판" hidden><p id="recognition-note"></p></div>
<fieldset class="turn-choice"><legend>차례 확인</legend><button id="turn-white" type="button" aria-pressed="false">백 차례</button><button id="turn-black" type="button" aria-pressed="false">흑 차례</button><p id="turn-note" class="hint"></p></fieldset>
<section class="chapter"><h2>특정 수 분석</h2><label>이 기물을 잡으면 어떻게 되나요?<select id="focus"><option value="*">판 전체 분석</option></select></label><p id="focus-note" class="hint"></p><label>어떤 말로 잡을까요?<select id="capture"><option value="">엔진이 선택</option></select></label><p id="capture-options-note" class="hint"></p></section>
<details id="correction"><summary>판 인식 수정</summary><p class="hint">인식한 말이 실제 화면과 다를 때 사용합니다. 아래에서 말을 고른 뒤 체스판의 잘못 인식된 칸을 누르세요.</p><label>칸에 놓을 말<select id="piece"><option value="">빈칸</option><option value="P">백 폰</option><option value="N">백 나이트</option><option value="B">백 비숍</option><option value="R">백 룩</option><option value="Q">백 퀸</option><option value="K">백 킹</option><option value="p">흑 폰</option><option value="n">흑 나이트</option><option value="b">흑 비숍</option><option value="r">흑 룩</option><option value="q">흑 퀸</option><option value="k">흑 킹</option></select></label></details>
<label id="overlay-check" class="check" hidden><input id="confirm-overlays" type="checkbox">원본과 비교해 색 표시가 겹친 칸을 확인했습니다</label>
<input id="fen" type="hidden"><input id="before-fen" type="hidden"><input id="target" type="hidden">
<label class="check"><input id="confirm" type="checkbox">말의 위치와 차례를 확인했습니다</label><button id="analyse" class="primary" disabled>이 판으로 분석</button></section>
<section id="board-section" hidden><div class="board-wrap"><div id="board" aria-label="체스판"></div><svg id="arrows" viewBox="0 0 800 800" aria-hidden="true"><defs><marker id="arrowhead" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#4ce9d1"></path></marker></defs><line id="arrow" marker-end="url(#arrowhead)" stroke="#4ce9d1" stroke-width="11" stroke-linecap="round" opacity=".85"></line></svg></div><div class="controls"><button id="previous" title="이전 수">←</button><button id="play">재생</button><button id="next" title="다음 수">→</button><span id="counter">0 / 0</span><button id="flip">뒤집기</button></div></section>
<section id="result" hidden><div class="result-head"><span id="evaluation" class="badge"></span><select id="branch" aria-label="이어질 수 선택"></select></div><p id="score-context" class="hint"></p><p id="turn-result" class="hint"></p><p id="focus-result" class="hint"></p><h2 id="brief"></h2><p id="capture-note" class="hint"></p><p id="step" class="step"></p><div id="move-list" class="move-list"></div><button id="refocus">보드 수정</button><button id="new">새로운 분석</button></section><p id="error" role="alert" hidden></p><footer>화살표를 따라 한 수씩 살펴보세요.</footer></main><script src="/assets/explain-copy.js"></script><script src="/assets/explain.js"></script></body></html>
