<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChessLens · 라벨 검토</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e5eaf3;background:#10151f}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:30px}h1{margin:8px 0;font-size:30px}p{color:#acb9cc;line-height:1.65}header{margin-bottom:22px}.bar,.choices,nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input,textarea{font:inherit;border:1px solid #495871;border-radius:9px;padding:11px;background:#202b3d;color:inherit}button{cursor:pointer}button:hover{border-color:#82ddc4}button:focus-visible{outline:3px solid #82ddc4}button[aria-pressed=true]{background:#267b67;border-color:#a1ffe4}button:disabled{opacity:.4;cursor:default}.primary{background:#267b67}main{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}.panel{background:#182130;border:1px solid #303e53;padding:24px;border-radius:16px}#tile{display:block;width:100%;height:300px;object-fit:contain;image-rendering:pixelated;background:#a3a3a3;border-radius:10px}label{display:block;margin:18px 0 7px}textarea,input[type=text]{width:100%}textarea{height:75px}small{color:#b4c1d5}#notice{min-height:26px;color:#a1ffe4}progress{width:100%;accent-color:#75d9bc;margin:14px 0}#grid{display:flex;flex-wrap:wrap;gap:6px}#grid button{padding:7px;font-size:12px}#grid .done{border-color:#75d9bc}#grid .active{background:#3c5678}.tag{color:#94e5cd}footer{font-size:13px;color:#aebbd0;margin-top:22px}@media(max-width:700px){main{grid-template-columns:1fr}body{padding:16px}}
</style>
<header><span class="tag">CHESSLENS / DATA REVIEW</span><h1>학습 데이터 50장, 직접 확인하기</h1><p>말 본체를 보고 진영을 선택하세요. 애매하면 보류하세요. 기존 진영은 이미지 전체 밝기로 추정한 값입니다.</p></header>
<div class="bar"><input id="reviewer" type="text" placeholder="검토자 이름" aria-label="검토자 이름" style="width:180px"><button id="export" class="primary">검토 JSON 다운로드</button><button id="import">JSON 불러오기</button><input id="file" type="file" accept="application/json,.json" hidden><select id="filter" aria-label="검토 상태 필터"><option value="all">전체</option><option value="pending">미검토</option><option value="unresolved">보류</option></select></div>
<progress id="progress" max="50" value="0"></progress><div id="count"></div><div id="notice" role="status" aria-live="polite"></div>
<main><section class="panel"><h2 id="title"></h2><img id="tile" alt="검토할 체스 말"><p id="original"></p><small>확대해도 진영을 알 수 없다면 보류하세요. 종류 자체가 잘못됐다면 메모에 남겨 주세요.</small></section>
<section class="panel"><h2>어느 진영인가요?</h2><div class="choices"><button data-side="white">흰말</button><button data-side="black">검은말</button><button data-side="unresolved">판단 보류</button></div>
<label for="note">검토 메모</label><textarea id="note" placeholder="헷갈리는 이유, 종류 오류 등"></textarea>
<label><input id="verified" type="checkbox"> 원본 보드·기보 또는 테마 진영 매핑으로 확인했어요</label><input id="evidence" type="text" aria-label="확인 근거" placeholder="확인 근거: 기보 / 원본 경로 / 테마 매핑"><p id="meaning"></p><button id="clear">이 항목 선택 취소</button></section></main>
<nav><button id="prev">← 이전</button><button id="next">다음 →</button><button id="pending">다음 미검토</button></nav><p>항목으로 이동 · 테두리가 초록이면 검토한 항목입니다.</p><div id="grid"></div>
<footer>선택은 이 브라우저에 임시 저장됩니다. 검토 후 JSON을 다운로드해 보관하세요. 시각 판단만으로는 학습 승인되지 않으며, 원본 라벨과 모델은 바뀌지 않습니다.</footer>
<script id="dataset" type="application/json">__DATA__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('dataset').textContent), items=data.items, key='chess-label-review-v1-'+data.manifest;
const $=id=>document.getElementById(id), names={white:'흰말',black:'검은말',unresolved:'판단 보류'}, kinds={pawn:'폰',knight:'나이트',bishop:'비숍',rook:'룩',queen:'퀸',king:'킹'};
let state={schema_version:1,manifest:data.manifest,reviewer:'',reviews:{}}, index=0;
function tell(s){$('notice').textContent=s}
function validate(s){
 if(!s||s.schema_version!==1||s.manifest!==data.manifest||typeof s.reviewer!=='string'||!s.reviews||Array.isArray(s.reviews)||typeof s.reviews!=='object')throw Error('이 화면의 검토 파일이 아닙니다.');
 const reviews={};
 for(const [id,r] of Object.entries(s.reviews)){
  const item=items.find(x=>x.id===id);
  if(!item||!r||r.sha256!==item.sha256||!['white','black','unresolved'].includes(r.side)||typeof r.note!=='string'||typeof r.evidence!=='string'||typeof r.verified!=='boolean'||typeof r.updated_at!=='string')throw Error('항목 또는 이미지 해시가 올바르지 않습니다.');
  if(r.verified&&(r.side==='unresolved'||!r.evidence.trim()||!s.reviewer.trim()))throw Error('확정 항목에는 검토자와 확인 근거가 필요합니다.');
  reviews[id]={sha256:item.sha256,side:r.side,note:r.note,evidence:r.evidence,verified:r.verified,updated_at:r.updated_at};
 }
 return {schema_version:1,manifest:data.manifest,reviewer:s.reviewer,reviews};
}
function persist(){try{localStorage.setItem(key,JSON.stringify(state));tell('브라우저에 임시 저장됨 · 완료 후 JSON을 다운로드하세요.')}catch(e){tell('브라우저 저장 불가 · 반드시 JSON을 다운로드하세요.')}}
function save(){
 const r=state.reviews[items[index].id];if(!r)return;
 r.note=$('note').value;r.evidence=$('evidence').value;
 r.verified=$('verified').checked && r.side!=='unresolved' && !!r.evidence.trim() && !!state.reviewer.trim();
 if($('verified').checked&&!r.verified)tell('확정하려면 진영 선택, 검토자 이름과 확인 근거가 필요합니다.');
 r.updated_at=new Date().toISOString();persist();render();
}
function visible(){return items.map((x,i)=>i).filter(i=>$('filter').value==='all'||($('filter').value==='pending'?!state.reviews[items[i].id]:state.reviews[items[i].id]?.side==='unresolved'))}
function render(){
 const item=items[index], r=state.reviews[item.id], count=Object.keys(state.reviews).length;
 $('title').textContent=`${index+1} / 50 · ${item.id} · ${kinds[item.kind]}`;$('tile').src=item.image;$('tile').alt=item.id+' '+kinds[item.kind];
 $('original').textContent='현재 자동 라벨: '+names[item.stored_side];$('note').value=r?.note||'';$('evidence').value=r?.evidence||'';$('verified').checked=!!r?.verified;
 $('verified').disabled=!r||r.side==='unresolved';$('note').disabled=!r;$('evidence').disabled=!r;
 document.querySelectorAll('[data-side]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.side===r?.side)));
 $('meaning').textContent=!r?'아직 검토하지 않았습니다.':r.side==='unresolved'?'보류 · 학습에 사용하지 않습니다.':r.verified?'근거 확인 완료 · '+(r.side===item.stored_side?'기존 라벨 일치':'기존 라벨 수정 요청'):'시각 검토 제안 · 원본 근거 확인 전입니다.';
 $('count').textContent=`검토 ${count}/50 · 미검토 ${50-count} · 보류 ${Object.values(state.reviews).filter(r=>r.side==='unresolved').length} · 근거 확인 ${Object.values(state.reviews).filter(r=>r.verified).length}`;$('progress').value=count;
 const list=visible();$('grid').replaceChildren();for(const i of list){const b=document.createElement('button');b.textContent=items[i].id;b.className=(state.reviews[items[i].id]?'done ':'')+(i===index?'active':'');b.onclick=()=>{index=i;render()};$('grid').append(b)}
 $('prev').disabled=index===0;$('next').disabled=index===49;
}
$('tile').onerror=()=>tell('이미지를 불러오지 못했습니다. HTML 옆의 images 폴더가 함께 있는지 확인하세요.');
document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{const item=items[index],old=state.reviews[item.id];state.reviews[item.id]={sha256:item.sha256,side:b.dataset.side,note:old?.note||'',evidence:old?.evidence||'',verified:false,updated_at:new Date().toISOString()};persist();render()});
$('note').onchange=save;$('evidence').onchange=save;$('verified').onchange=save;
$('reviewer').onchange=()=>{state.reviewer=$('reviewer').value;Object.values(state.reviews).forEach(r=>r.verified=false);persist();render()};
$('clear').onclick=()=>{delete state.reviews[items[index].id];persist();render()};$('prev').onclick=()=>{index--;render()};$('next').onclick=()=>{index++;render()};
$('pending').onclick=()=>{for(let n=1;n<=50;n++){const i=(index+n)%50;if(!state.reviews[items[i].id]){index=i;render();return}}tell('모든 항목을 검토했습니다.')};
$('filter').onchange=()=>{const list=visible();if(list.length)index=list[0];render()};
function exported(){const s=validate(state);s.exported_at=new Date().toISOString();for(const [id,r] of Object.entries(s.reviews)){const item=items.find(i=>i.id===id);r.original_side=item.stored_side;r.kind=item.kind;r.status=r.side==='unresolved'?'unresolved':r.verified?(r.side===item.stored_side?'confirmed':'rejected'):'proposed';r.approved_for_training_or_benchmark=r.verified;}return s}
$('export').onclick=()=>{try{const blob=new Blob([JSON.stringify(exported(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='chess-label-review-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);tell('JSON 다운로드를 요청했습니다. 다운로드 폴더에서 확인하세요.')}catch(e){tell(e.message)}};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const file=$('file').files[0];if(!file)return;const incoming=validate(JSON.parse(await file.text()));if(Object.keys(state.reviews).length&&!confirm('현재 검토 내용을 불러온 파일로 교체할까요?'))return;state=incoming;$('reviewer').value=state.reviewer;persist();render()}catch(e){tell('불러오기 실패: '+e.message)}finally{$('file').value=''}};
try{const raw=localStorage.getItem(key);if(raw){state=validate(JSON.parse(raw));$('reviewer').value=state.reviewer;tell('이전 임시 저장 내용을 복원했습니다.')}}catch(e){tell('임시 저장을 읽지 못했습니다. JSON 파일을 불러오세요.')}render();
</script></html>
