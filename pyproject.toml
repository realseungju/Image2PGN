[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chesslens"
version = "0.2.0"
description = "Local chess screenshot recognition, reviewed positions, and Stockfish replay"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "Pillow>=10,<13",
  "chess>=1.11,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1",
  "torch>=2.12.1,<2.13",
]

[project.scripts]
chesslens = "image2pgn.launcher:main"

[project.optional-dependencies]
training = ["datasets>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[tool.setuptools.packages.find]
include = ["image2pgn*"]
namespaces = false

[tool.setuptools.package-data]
image2pgn = [
  "assets/*.pt", "assets/*.json", "assets/*.md",
  "data/*.json", "data/*.md",
  "web/*.html", "web/*.css", "web/*.js",
  "web/pieces/*", "web/fonts/*",
  "board_review.html", "board_geometry.js", "windows_ocr.ps1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
